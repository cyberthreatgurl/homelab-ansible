---
- name: Bootstrap Docker/Webmin Node for Least-Privilege Ansible
  hosts: docker_servers
  remote_user: kelly
  become: true
  vars:
    ansible_controller_ip: "10.0.0.115"
    # admin_users comes from inventory/group_vars/all.yml. Each key gets
    # the same "from=<controller-ip>" source restriction the single key
    # used to have.
    admin_authorized_keys: >-
      {{ admin_users | map(attribute='key')
         | map('regex_replace', '^(.*)$', 'from="' + ansible_controller_ip + '" \1')
         | join('\n') }}

  tasks:
    - name: Create ansible-deploy service account
      ansible.builtin.user:
        name: ansible-deploy
        shell: /bin/bash
        system: true
        create_home: true

    - name: Deploy admin SSH keys (exclusive -- removes any key not in admin_users)
      ansible.posix.authorized_key:
        user: ansible-deploy
        key: "{{ admin_authorized_keys }}"
        exclusive: true
      # One task, all keys joined into a single multi-line string -- do
      # NOT loop this with exclusive:true, each loop iteration would wipe
      # out the previous iteration's key and only the last admin in the
      # list would end up with access.

    - name: Install Webmin TLS deployment helper script
      ansible.builtin.copy:
        dest: /usr/local/bin/deploy-webmin-tls.sh
        owner: root
        group: root
        mode: '0750'
        content: |
          #!/usr/bin/env bash
          set -euo pipefail

          # Expects cert and private key to be deposited in /tmp
          if [ ! -f /tmp/webmin.crt ] || [ ! -f /tmp/webmin.key ]; then
              echo "Error: Required cert or key file missing from /tmp." >&2
              exit 1
          fi

          # Webmin typically uses a combined PEM (cert + private key) for miniserv.pem
          cat /tmp/webmin.crt /tmp/webmin.key > /etc/webmin/miniserv.pem
          chmod 0600 /etc/webmin/miniserv.pem
          chown root:root /etc/webmin/miniserv.pem

          # Cleanup staged temp files
          rm -f /tmp/webmin.crt /tmp/webmin.key

          # Restart Webmin service to load new cert
          systemctl restart webmin

    - name: Install granular sudoers rule
      ansible.builtin.copy:
        dest: /etc/sudoers.d/99-ansible-webmin-ssl
        owner: root
        group: root
        mode: '0440'
        validate: 'visudo -cf %s'
        content: "ansible-deploy ALL=(root) NOPASSWD: /usr/local/bin/deploy-webmin-tls.sh\n"
